name: Dependabot Auto-merge

on:
  workflow_run:
    workflows: ["Build and Test"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: >-
      github.repository == 'blrain3/quartz' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.actor.login == 'dependabot[bot]' &&
      contains(github.event.workflow_run.head_branch, 'quartz-ecosystem')
    runs-on: ubuntu-latest
    steps:
      - name: Resolve pull request
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          number=$(gh pr list --state open --json number,headRefOid \
            --jq "map(select(.headRefOid == \"${HEAD_SHA}\")) | .[0].number // empty")
          if [ -z "$number" ]; then
            echo "No open PR matches ${HEAD_SHA}; nothing to merge."
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "number=${number}" >> "$GITHUB_OUTPUT"
          echo "found=true" >> "$GITHUB_OUTPUT"

      - name: Require every check on the commit to have succeeded
        if: steps.pr.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          runs=$(gh api "repos/${GH_REPO}/commits/${HEAD_SHA}/check-runs" --paginate \
            --jq '.check_runs[] | "\(.name)\t\(.status)\t\(.conclusion // "")"')
          echo "$runs"
          required=$(gh api "repos/${GH_REPO}/commits/${HEAD_SHA}/check-runs" --paginate --slurp \
            --jq '[.[].check_runs[] | select(.name | startswith("build-and-test ("))] | length == 3 and all(.[]; .status == "completed" and .conclusion == "success")')
          test "$required" = "true"
          bad=$(printf '%s\n' "$runs" | awk -F'\t' '
            $2 != "completed" { print; next }
            $3 != "success" && $3 != "neutral" && $3 != "skipped" { print }
          ')
          if [ -n "$bad" ]; then
            echo "Refusing to merge - not all checks succeeded:"
            printf '%s\n' "$bad"
            exit 1
          fi

      # Installs use legacy peer mode: CI success is not peer-compatibility evidence.
      # Require the owner to audit peers and approve this exact commit explicitly.
      - name: Require current owner peer-compatibility review
        if: steps.pr.outputs.found == 'true'
        id: review
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          approvals=$(gh api "repos/${GH_REPO}/pulls/${PR_NUMBER}/reviews" --paginate --slurp \
            --jq '[.[][] | select(.author_association == "OWNER")] | sort_by(.submitted_at) | [last | select(. != null and .state == "APPROVED" and .commit_id == env.HEAD_SHA and (.body | contains("PEER_COMPATIBILITY_VERIFIED")))] | length')
          if [ "$approvals" -gt 0 ]; then
            echo "approved=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Manual peer review of the current commit is required; no automatic merge."
            echo "approved=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout trusted policy code, never the pull request
        if: steps.pr.outputs.found == 'true'
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Setup Node
        if: steps.pr.outputs.found == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Confirm actual locked updates contain no major bump
        if: steps.pr.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          base=$(gh pr view "$PR_NUMBER" --json baseRefOid --jq .baseRefOid)
          head=$(gh pr view "$PR_NUMBER" --json headRefOid --jq .headRefOid)
          test "$head" = "$HEAD_SHA"
          gh api "repos/${GH_REPO}/contents/package-lock.json?ref=${base}" --jq .content | base64 --decode > "$RUNNER_TEMP/base-lock.json"
          gh api "repos/${GH_REPO}/contents/package-lock.json?ref=${head}" --jq .content | base64 --decode > "$RUNNER_TEMP/head-lock.json"
          node scripts/check-lockfile-majors.mjs "$RUNNER_TEMP/base-lock.json" "$RUNNER_TEMP/head-lock.json"

      - name: Merge
        if: steps.pr.outputs.found == 'true' && steps.review.outputs.approved == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: gh pr merge "$PR_NUMBER" --squash --delete-branch --match-head-commit "$HEAD_SHA"
