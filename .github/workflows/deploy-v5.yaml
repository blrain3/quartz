name: Inspect Quartz Cloudflare control plane

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Read deployment, version, and Builds metadata only
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: python
        run: |
          import json, os, urllib.request, urllib.error
          account = os.environ['CF_ACCOUNT']
          headers = {'Authorization': 'Bearer ' + os.environ['CF_TOKEN']}
          endpoints = [
            ('deployments', f'/accounts/{account}/workers/scripts/quartz/deployments'),
            ('versions', f'/accounts/{account}/workers/scripts/quartz/versions'),
            ('settings', f'/accounts/{account}/workers/scripts/quartz/settings'),
            ('build-current', f'/accounts/{account}/builds/builds/b5e63237-c07c-400c-a7a1-b360293ba5d7'),
            ('build-logs', f'/accounts/{account}/builds/builds/b5e63237-c07c-400c-a7a1-b360293ba5d7/logs'),
            ('triggers', f'/accounts/{account}/builds/workers/9bc8f26394c84b11a59ced84b4ecff75/triggers'),
            ('build-history', f'/accounts/{account}/builds/workers/9bc8f26394c84b11a59ced84b4ecff75/builds?per_page=5'),
          ]
          def sanitize(obj):
            if isinstance(obj, dict):
              return {k: ('[REDACTED]' if any(s in k.lower() for s in ['token', 'secret', 'password', 'binding']) else sanitize(v)) for k,v in obj.items()}
            if isinstance(obj, list):
              return [sanitize(v) for v in obj]
            return obj
          for label, path in endpoints:
            try:
              with urllib.request.urlopen(urllib.request.Request('https://api.cloudflare.com/client/v4'+path, headers=headers)) as r:
                data = json.load(r)
              print(label, json.dumps(sanitize(data), ensure_ascii=False))
            except urllib.error.HTTPError as e:
              print(label, 'HTTP', e.code, e.read().decode())
