name: Inspect Quartz Cloudflare control plane

on:
  workflow_dispatch:
    inputs:
      repair_cf:
        description: Convert Quartz Builds to full-lifecycle preview-only uploads
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Read deployment, version, and Builds metadata only
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          REPAIR_CF: ${{ inputs.repair_cf }}
        shell: python
        run: |
          import json, os, urllib.request, urllib.error
          account = os.environ['CF_ACCOUNT']
          headers = {'Authorization': 'Bearer ' + os.environ['CF_TOKEN']}
          endpoints = [
            ('deployments', f'/accounts/{account}/workers/scripts/quartz/deployments'),
            ('versions', f'/accounts/{account}/workers/scripts/quartz/versions'),
            ('settings', f'/accounts/{account}/workers/scripts/quartz/settings'),
            ('build-current', f'/accounts/{account}/builds/builds/b5e63237-c07c-400c-a7a1-b360293ba5d7'),
            ('build-logs', f'/accounts/{account}/builds/builds/b5e63237-c07c-400c-a7a1-b360293ba5d7/logs'),
            ('triggers', f'/accounts/{account}/builds/workers/9bc8f26394c84b11a59ced84b4ecff75/triggers'),
            ('build-history', f'/accounts/{account}/builds/workers/9bc8f26394c84b11a59ced84b4ecff75/builds?per_page=5'),
          ]
          def sanitize(obj):
            if isinstance(obj, dict):
              return {k: ('[REDACTED]' if any(s in k.lower() for s in ['token', 'secret', 'password', 'binding']) else sanitize(v)) for k,v in obj.items()}
            if isinstance(obj, list):
              return [sanitize(v) for v in obj]
            return obj
          def request(path, method='GET', payload=None):
            data = None if payload is None else json.dumps(payload).encode()
            req = urllib.request.Request('https://api.cloudflare.com/client/v4'+path, data=data, headers={**headers, 'Content-Type': 'application/json'}, method=method)
            with urllib.request.urlopen(req) as r:
              result = json.load(r)
            assert result.get('success'), sanitize(result)
            return result
          if os.environ.get('REPAIR_CF') == 'true':
            baseline = request(f'/accounts/{account}/workers/scripts/quartz/deployments')['result']['deployments'][0]
            print('pre-repair-serving', json.dumps(sanitize(baseline)))
            assert baseline['versions'] == [{'version_id': '9681bf0b-ea69-4431-917e-7cdf352d375e', 'percentage': 100}], 'Unexpected serving version; stop before configuration writes'
            for trigger in ['77a3f091-c67d-4ec9-8fb7-bbff59db7ab5', 'fbd4c585-1063-42fa-ae8c-e38de15a167d']:
              path = f'/accounts/{account}/builds/triggers/{trigger}'
              updated = request(path, 'PATCH', {'build_command': 'npm run check && npm test && npm run build', 'deploy_command': 'npx wrangler versions upload'})
              print('updated-trigger', json.dumps(sanitize(updated)))
            current = request(f'/accounts/{account}/builds/builds/b5e63237-c07c-400c-a7a1-b360293ba5d7')['result']
            if current['status'] != 'stopped':
              print('cancel-old-production-build', json.dumps(sanitize(request(f'/accounts/{account}/builds/builds/b5e63237-c07c-400c-a7a1-b360293ba5d7/cancel', 'POST'))))
            readback = request(f'/accounts/{account}/builds/workers/9bc8f26394c84b11a59ced84b4ecff75/triggers')['result']
            assert len(readback) == 2
            for t in readback:
              assert t['build_command'] == 'npm run check && npm test && npm run build'
              assert t['deploy_command'] == 'npx wrangler versions upload'
            print('verified-preview-only-triggers', json.dumps(sanitize(readback)))
          for label, path in endpoints:
            try:
              with urllib.request.urlopen(urllib.request.Request('https://api.cloudflare.com/client/v4'+path, headers=headers)) as r:
                data = json.load(r)
              print(label, json.dumps(sanitize(data), ensure_ascii=False))
            except urllib.error.HTTPError as e:
              print(label, 'HTTP', e.code, e.read().decode())
